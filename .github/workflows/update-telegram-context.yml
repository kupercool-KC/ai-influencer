name: Update Telegram Bot Context

# Keeps docs/telegram-bot-context.md fresh so the Telegram bot's architecture/pipeline
# knowledge never goes stale the way a hardcoded prose block in webhook.js did (see the PR
# that added this file). Runs daily — more often than the Control Board's ~2-day cadence,
# since this doc feeds a system prompt that's wrong in front of Iddo the moment it drifts,
# not just wrong on a status page.
#
# Needs repo secret: ANTHROPIC_API_KEY (same value already used by update-control-board.yml
# and the Telegram bot's Chat mode on Vercel).

on:
  schedule:
    - cron: '15 20 * * *' # nightly, Israel-night either side of DST (23:15 IDT / 22:15 IST)
  workflow_dispatch: {} # manual "run now" button in the Actions tab, for testing

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `git log <last-doc-commit>..HEAD` works

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ask Claude to refresh the bot context doc
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/update-telegram-context.mjs

      - name: Commit if changed
        run: |
          git config user.name "telegram-context-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/telegram-bot-context.md
          if git diff --cached --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "Auto-update Telegram bot context [skip ci]"
            git push
          fi
