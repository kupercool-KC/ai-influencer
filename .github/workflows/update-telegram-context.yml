name: Update Telegram Bot Context

# Keeps docs/telegram-bot-context.md fresh so the Telegram bot's architecture/pipeline
# knowledge never goes stale the way a hardcoded prose block in webhook.js did (see the PR
# that added this file). Runs daily — more often than the Control Board's ~2-day cadence,
# since this doc feeds a system prompt that's wrong in front of Iddo the moment it drifts,
# not just wrong on a status page.
#
# Needs repo secret: ANTHROPIC_API_KEY (same value already used by update-control-board.yml
# and the Telegram bot's Chat mode on Vercel).

on:
  schedule:
    - cron: '15 20 * * *' # nightly, Israel-night either side of DST (23:15 IDT / 22:15 IST)
  workflow_dispatch: {} # manual "run now" button in the Actions tab, for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `git log <last-doc-commit>..HEAD` works

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ask Claude to refresh the bot context doc
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/update-telegram-context.mjs

      # main is a protected branch (PR + the lint-and-build check required) —
      # a direct `git push` here is rejected outright (GH006), which is
      # exactly what this workflow did on every run since it was added —
      # never actually updated the doc, just generated a failure email each
      # time. Branch + PR + wait-for-check + merge keeps this unattended.
      - name: Commit to a branch if changed
        id: commit
        run: |
          git config user.name "telegram-context-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/telegram-bot-context.md
          if git diff --cached --quiet; then
            echo "No change — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH="auto/telegram-context-$(date -u +%Y%m%d%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "Auto-update Telegram bot context"
            git push -u origin "$BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR, wait for checks, merge
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --head "${{ steps.commit.outputs.branch }}" --base main \
            --title "Auto-update Telegram bot context" \
            --body "Automated — see .github/workflows/update-telegram-context.yml"
          PR_NUM=$(gh pr view "${{ steps.commit.outputs.branch }}" --json number -q .number)
          gh pr checks "$PR_NUM" --watch --fail-fast
          gh pr merge "$PR_NUM" --merge --delete-branch
