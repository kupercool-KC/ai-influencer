name: Scout test single video

# On-demand diagnostic: runs scout -> analyze -> plan on ONE specific Instagram post/reel
# URL (not an account) and prints every intermediate result to the log — the scraped
# metadata, the visual analysis, and the final generation prompt + caption. Deliberately
# stops there: no Higgsfield call, no Buffer draft. For checking the pipeline against a
# specific video before trusting it in the unattended daily pipeline.
#
# Needs repo secret: ANTHROPIC_API_KEY (same value already used by ivy-daily-content.yml).

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Full Instagram post/reel URL to test"
        required: true
      persona_dir:
        description: "Path to docs/personas/<Name>/, relative to repo root"
        default: "docs/personas/Ivy Vale"
        required: true
      kind:
        description: "TEMP smoke test: image|video"
        default: "image"
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents/content-scout
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run inspire (TEMP smoke test)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          IN_VIDEO_URL: ${{ inputs.video_url }}
          IN_PERSONA_DIR: ${{ inputs.persona_dir }}
          IN_KIND: ${{ inputs.kind }}
        run: |
          python -m content_scout.cli inspire --url "$IN_VIDEO_URL" --kind "${IN_KIND:-image}" --note "make it cozy" --persona-dir "../../$IN_PERSONA_DIR"
          R=$(ls -d data/runs/*inspire* | head -1)
          echo "=== telegram_summary ==="; cat "$R/telegram_summary.txt"
          echo "=== content_plan ==="; cat "$R/content_plan.json"
          echo "=== keyframes ==="; ls -la "$R"/videos/*/frames/
