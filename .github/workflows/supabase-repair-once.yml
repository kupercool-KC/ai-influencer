name: One-time Supabase migration history repair

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref sljgfpyzfdmskcbrnzen
      - run: |
          supabase migration repair --status applied 0001
          supabase migration repair --status applied 0002
          supabase migration repair --status applied 0003
          supabase migration repair --status applied 0004
