name: Ivy daily content pipeline

# Fully automated daily pipeline for Ivy Vale: scouts real recent posts from 3 accessible
# Instagram accounts in her niche (itslenasky and lilyc.larkee are behind Instagram's
# "Restricted profile" wall and are deliberately excluded — see
# agents/content-scout/README.md's Known limitations), analyzes them headlessly via Claude
# (content_scout's `analyze` command — no human/agent needed), turns the findings into one
# new on-brand image + caption for Ivy via the Soul-locked Higgsfield technique, and queues
# it as a Buffer DRAFT on both her channels for manual review.
#
# Buffer drafts are NEVER auto-published — that's a deliberate, explicit choice (see
# buffer-dispatch.yml). This workflow only gets you to "ready for your one-tap approval."
#
# workflow_dispatch also accepts num_days > 1 for a one-time backfill (e.g. seeding a
# week of drafts at once) — it reuses the exact same code path as the daily cron run
# rather than a separate one-off script.
#
# Needs repo secrets: ANTHROPIC_API_KEY, HIGGSFIELD_CREDENTIALS_B64, BUFFER_API_KEY,
# TELEGRAM_BOT_TOKEN, TELEGRAM_OWNER_CHAT_ID (all already configured for other workflows).
# SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY are optional — when set, each draft is also
# logged as a scheduled_dispatches row (same as buffer-dispatch.yml on its own).

on:
  schedule:
    - cron: '0 6 * * *' # ~09:00 Israel time (IDT/IST either side of DST)
  workflow_dispatch:
    inputs:
      num_days:
        description: "How many days of content to generate this run (use >1 only for a one-time backfill)"
        default: "1"
        required: true
      inspiration_url:
        description: "Optional: ONE Instagram/TikTok post or reel link. Scout studies it and the rest of the pipeline makes content inspired by it (this replaces the account scan for this run). Normally sent from Telegram."
        default: ""
        required: false
      inspiration_kind:
        description: "Format: image (feed photo + stories), carousel (multi-photo post), or video (Reel + TikTok). Applies to a pasted link and to the normal scan."
        type: choice
        options: [carousel, image, video]
        default: carousel
        required: false
      inspiration_note:
        description: "With inspiration_url: extra direction, e.g. 'cozier, at sunset'"
        default: ""
        required: false
      analyze_only:
        description: "With inspiration_url: only look at the post and report what it is — plan and generate nothing"
        type: boolean
        default: false
        required: false
      plan_approval:
        description: "Stop after the plan and wait for the owner's tap in Telegram before spending any credits (default: yes)"
        type: boolean
        default: true
        required: false
      resume_run_id:
        description: "Produce a plan the owner already approved (its run_id) — skips scouting and planning"
        default: ""
        required: false

run-name: "${{ inputs.resume_run_id != '' && format('Ivy produces approved plan: {0}', inputs.resume_run_id) || inputs.inspiration_url != '' && format('Ivy {0} ({1}): {2}', inputs.analyze_only && 'analyzes link' || 'from link', inputs.inspiration_kind, inputs.inspiration_url) || 'Ivy daily content pipeline' }}"

# Two runs refreshing the same Higgsfield session at once would invalidate each other's token.
concurrency:
  group: higgsfield-session
  cancel-in-progress: false

env:
  HIGGSFIELD_WORKSPACE_ID: "464e34d3-f7ad-4da0-a24a-c00a94910a9b"
  # text2image_soul_v2 + a single image reference was tried first (the Soul id below is
  # still valid and usable elsewhere) but verified live 2026-09-29, twice, with very
  # different prompts: it just reproduces the reference photo's scene almost verbatim
  # instead of following the prompt's new scene. Switched to nano_banana_pro with the
  # SAME multi-reference set already proven to work for Ivy's character sheet (see
  # docs/personas/Ivy Vale/persona.json's training_images and PR #29) — multiple angles
  # give it enough identity signal without anchoring to one exact photo's scene.
  IVY_SOUL_ID: "850935eb-8238-4507-9df5-a28cefe9a461"
  IVY_REFERENCES: "../../docs/personas/Ivy Vale/soul-training/01-front-smile.jpg,../../docs/personas/Ivy Vale/soul-training/05-threequarter-right-golden.jpg,../../docs/personas/Ivy Vale/soul-training/04-profile-overcast.jpg"
  BUFFER_CHANNEL_INSTAGRAM: "6aaff65cea19ca0bde976b01"
  BUFFER_CHANNEL_TIKTOK: "6aaff5bdea19ca0bde975a46"
  # Daily pipeline notifications go to the "AI Influencer Studio" Forum group's existing
  # per-agent Topics (2026-10-01, per Iddo), not the bot's DM — Scout+Analysis share the
  # Scout topic (both are research output), Generator and Dispatcher get their own. Thread
  # ids came from each Topic's "Copy Link" (https://t.me/c/4305763915/<id>) since Telegram
  # only records a Topic's name in our DB at creation/rename, and these predate that code.
  TELEGRAM_IVY_CHAT_ID: "-1004305763915"
  TELEGRAM_SCOUT_THREAD_ID: "3"
  TELEGRAM_GENERATOR_THREAD_ID: "6"
  TELEGRAM_DISPATCH_THREAD_ID: "7"

jobs:
  # The owner can pause the automatic daily generation from Telegram (preference key pause_daily_generation,
  # e.g. "we already have enough pictures"). Only the SCHEDULED run honors it — a link he sends or a manual
  # run always goes through. Resume by deleting that preference ("תחזור לייצר").
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          SKIP=false
          if [ "$EVENT" = "schedule" ]; then
            # A failed lookup must never skip the day's run: treat it as "not paused".
            ROW=$(curl -sf "$SUPABASE_URL/rest/v1/owner_preferences?key=eq.pause_daily_generation&select=value" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" || echo '[]')
            if [ "$(jq 'length' <<< "$ROW" 2>/dev/null || echo 0)" -gt 0 ]; then SKIP=true; fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = "true" ]; then echo "Daily generation is paused by the owner — nothing generated, no credits spent."; fi

  content:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: agents/content-scout
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Install repo Node packages (Supabase client for the helper scripts)
        run: cd "$GITHUB_WORKSPACE" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Load inspiration accounts from the database
        id: accounts
        if: inputs.inspiration_url == '' && inputs.resume_run_id == ''
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          OUT=$(node "$GITHUB_WORKSPACE/scripts/inspiration.mjs" accounts)
          echo "instagram=$(sed -E 's/^instagram=([^;]*);.*/\1/' <<< "$OUT")" >> "$GITHUB_OUTPUT"
          echo "tiktok=$(sed -E 's/.*;tiktok=(.*)$/\1/' <<< "$OUT")" >> "$GITHUB_OUTPUT"

      - name: Install Higgsfield CLI + restore its login from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HIGGSFIELD_CREDENTIALS_B64: ${{ secrets.HIGGSFIELD_CREDENTIALS_B64 }}
        run: |
          npm i -g @higgsfield/cli
          mkdir -p ~/.config/higgsfield
          # The session is kept in Supabase and rewritten after every run (see
          # scripts/higgsfield-creds.mjs for why a static secret can't work). The old B64
          # secret is only a first-run fallback for before the one-time seed has been done.
          if ! node "$GITHUB_WORKSPACE/scripts/higgsfield-creds.mjs" load; then
            echo "$HIGGSFIELD_CREDENTIALS_B64" | base64 -d > ~/.config/higgsfield/credentials.json
          fi
          chmod 600 ~/.config/higgsfield/credentials.json
          higgsfield workspace set "$HIGGSFIELD_WORKSPACE_ID"
          # Force the CLI to refresh now, then persist immediately — so the new refresh token
          # is safe in Supabase even if a later step fails.
          higgsfield account status
          node "$GITHUB_WORKSPACE/scripts/higgsfield-creds.mjs" save

      - name: Scout — discover recent posts from Ivy's inspiration accounts
        id: scout
        if: inputs.inspiration_url == '' && inputs.resume_run_id == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          IG_ACCOUNTS: ${{ steps.accounts.outputs.instagram }}
          TT_ACCOUNTS: ${{ steps.accounts.outputs.tiktok }}
        run: |
          set -e
          OUT=$(python -m content_scout.cli run \
            --niche "ivy vale coastal wellness" \
            --platforms instagram,tiktok \
            --instagram-accounts "${IG_ACCOUNTS:-nika_yammys,milena_milenko,sophiebatzloff,ellarayblond}" \
            --tiktok-accounts "${TT_ACCOUNTS:-millane,chiaraking,sydneyschiffer,ell_turner}" \
            --since-days 14 \
            --per-platform-limit 12)
          echo "$OUT"
          RUN_ID=$(echo "$OUT" | grep -oE "Run '[^']+'" | head -1 | sed "s/Run '//;s/'//")
          if [ -z "$RUN_ID" ]; then echo "Could not parse run id from scout output" >&2; exit 1; fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          VIDEO_LINE=$(echo "$OUT" | grep -oE "[0-9]+ video\(s\) selected" | head -1)
          echo "video_line=${VIDEO_LINE:-videos selected (count unavailable)}" >> "$GITHUB_OUTPUT"
          SCAN_ERRORS=$(echo "$OUT" | grep -E "discovery failed" | head -2 | sed -E 's/.*discovery failed: //' | cut -c1-140 | tr '\n' '|')
          echo "scan_errors=$SCAN_ERRORS" >> "$GITHUB_OUTPUT"

      - name: Inspire — study the pasted link and plan content from it
        id: inspire
        if: inputs.inspiration_url != '' && inputs.resume_run_id == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Untrusted workflow_dispatch inputs go through env vars, never inline in the script.
          IN_URL: ${{ inputs.inspiration_url }}
          IN_KIND: ${{ inputs.inspiration_kind }}
          IN_NOTE: ${{ inputs.inspiration_note }}
          IN_ANALYZE: ${{ inputs.analyze_only }}
        run: |
          set +e
          ANALYZE_FLAG=""; [ "$IN_ANALYZE" = "true" ] && ANALYZE_FLAG="--analyze-only"
          OUT=$(python -m content_scout.cli inspire --url "$IN_URL" --kind "$IN_KIND" --note "$IN_NOTE" $ANALYZE_FLAG \
                  --persona-dir "../../docs/personas/Ivy Vale" 2>inspire.err)
          CODE=$?
          echo "$OUT"; cat inspire.err >&2
          if [ "$CODE" -eq 2 ]; then
            # A problem with the link itself (private post, login wall...) — tell the owner in
            # plain words in the Scout topic instead of a generic "pipeline failed".
            source "$GITHUB_WORKSPACE/scripts/tg.sh"
            MSG=$(grep -o 'INSPIRE_ERROR: .*' inspire.err | sed 's/INSPIRE_ERROR: //')
            tg_send "$TELEGRAM_SCOUT_THREAD_ID" "🔍 <b>Scout — לא הצלחתי להשתמש בקישור</b>"$'\n'"• $(esc "$MSG")"
            echo "user_error=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          [ "$CODE" -ne 0 ] && exit "$CODE"
          RUN_ID=$(echo "$OUT" | grep -oE "Run '[^']+'" | head -1 | sed "s/Run '//;s/'//")
          if [ -z "$RUN_ID" ]; then echo "Could not parse run id from inspire output" >&2; exit 1; fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve run id
        id: run
        run: echo "run_id=${{ steps.scout.outputs.run_id || steps.inspire.outputs.run_id || inputs.resume_run_id }}" >> "$GITHUB_OUTPUT"

      - name: Restore the approved plan
        if: inputs.resume_run_id != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p "data/runs/${{ inputs.resume_run_id }}"
          node "$GITHUB_WORKSPACE/scripts/content-item.mjs" export-plan --run-id "${{ inputs.resume_run_id }}" --out "data/runs/${{ inputs.resume_run_id }}/content_plan.json"

      - name: Decide whether this run produces or waits for plan approval
        id: mode
        env:
          IN_ANALYZE: ${{ inputs.analyze_only }}
          IN_PLAN_APPROVAL: ${{ inputs.plan_approval }}
          IN_RESUME: ${{ inputs.resume_run_id }}
        run: |
          PRODUCE=false
          if [ "$IN_ANALYZE" != "true" ] && { [ -n "$IN_RESUME" ] || [ "$IN_PLAN_APPROVAL" = "false" ]; }; then PRODUCE=true; fi
          echo "produce=$PRODUCE" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram — Scout findings
        if: inputs.inspiration_url == '' && inputs.resume_run_id == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VIDEO_LINE: ${{ steps.scout.outputs.video_line }}
          SCAN_ERRORS: ${{ steps.scout.outputs.scan_errors }}
        run: |
          source "$GITHUB_WORKSPACE/scripts/tg.sh"
          N=$(grep -oE '^[0-9]+' <<< "$VIDEO_LINE" || true)
          MSG="🔍 <b>Scout — סריקה יומית</b>"$'\n'"• נסרקו החשבונות שברשימה, 14 הימים האחרונים"$'\n'"• נבחרו ${N:-?} סרטונים להשראה"
          if [ -n "$SCAN_ERRORS" ]; then
            MSG="$MSG"$'\n'"• ⚠️ חלק מהסריקה נכשל: $(esc "$SCAN_ERRORS")"
            grep -qi "usage\|plan\|limit" <<< "$SCAN_ERRORS" && MSG="$MSG"$'\n'"• נראה שנגמר תקציב ה-Apify החודשי — צריך לשדרג או לחכות לאיפוס"
          fi
          [ "${N:-0}" = "0" ] && MSG="$MSG"$'\n'"• 😕 בלי סרטונים לניתוח, אין השראה מהסריקה היום"
          tg_send "$TELEGRAM_SCOUT_THREAD_ID" "$MSG"

      - name: Notify Telegram — Scout studied your link
        if: inputs.inspiration_url != '' && inputs.resume_run_id == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IN_URL: ${{ inputs.inspiration_url }}
        run: |
          source "$GITHUB_WORKSPACE/scripts/tg.sh"
          RUN_DIR="data/runs/${{ steps.run.outputs.run_id }}"
          FRAME=$(ls "$RUN_DIR"/videos/*/frames/keyframe_01.jpg 2>/dev/null | head -1)
          if [ -n "$FRAME" ]; then
            node "$GITHUB_WORKSPACE/scripts/telegram-send.mjs" --chat "$TELEGRAM_IVY_CHAT_ID" --thread "$TELEGRAM_SCOUT_THREAD_ID" \
              --media "$(jq -nc --arg p "$FRAME" --arg c "🔗 הפוסט שלמדתי" '[{type:"photo", path:$p, caption:$c}]')" || echo "warning: could not send the source picture"
          fi
          DIGEST=$(python -m content_scout.cli digest-he --kind link --file "$RUN_DIR/telegram_summary.txt")
          tg_send "$TELEGRAM_SCOUT_THREAD_ID" "🔗 $(digest_html "$DIGEST" "למדתי את הקישור")"$'\n'"<a href=\"$(esc "$IN_URL")\">לפוסט המקורי</a>"

      - name: Offer to create from it (analysis-only requests)
        if: inputs.inspiration_url != '' && inputs.analyze_only == true && inputs.resume_run_id == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IN_URL: ${{ inputs.inspiration_url }}
        run: |
          source "$GITHUB_WORKSPACE/scripts/tg.sh"
          RUN_DIR="data/runs/${{ steps.run.outputs.run_id }}"
          ID=$(node "$GITHUB_WORKSPACE/scripts/inspiration.mjs" add-candidate --url "$IN_URL" --author "$(jq -r '.author // empty' "$RUN_DIR/inspire.json")" --platform "$(jq -r '.platform // empty' "$RUN_DIR/inspire.json")")
          KB=$(jq -nc --arg c "insp:go:$ID" --arg v "insp:vid:$ID" --arg k "insp:skip:$ID" '{inline_keyboard:[[{text:"🎨 קרוסלה בהשראתו", callback_data:$c},{text:"🎬 סרטון בהשראתו", callback_data:$v}],[{text:"⏭ לא, תודה", callback_data:$k}]]}')
          tg_send "$TELEGRAM_SCOUT_THREAD_ID" "❓ <b>רוצה שאיצור ממנו משהו?</b>"$'\n'"עדיין לא יצרתי כלום ולא הוצאתי קרדיטים." "$KB"

      - name: Analyze — headless stage 7+10 (visual analysis + synthesis)
        if: inputs.inspiration_url == '' && inputs.resume_run_id == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m content_scout.cli analyze --run-id "${{ steps.run.outputs.run_id }}"

      - name: Notify Telegram — Analysis
        if: inputs.inspiration_url == '' && inputs.resume_run_id == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          source "$GITHUB_WORKSPACE/scripts/tg.sh"
          SUMMARY_FILE="data/runs/${{ steps.run.outputs.run_id }}/telegram_summary.txt"
          if [ -f "$SUMMARY_FILE" ] && ! grep -q "nothing to synthesize" "$SUMMARY_FILE"; then
            DIGEST=$(python -m content_scout.cli digest-he --kind scan --file "$SUMMARY_FILE")
            tg_send "$TELEGRAM_SCOUT_THREAD_ID" "🧠 $(digest_html "$DIGEST" "מה למדתי מהסריקה")"
          else
            tg_send "$TELEGRAM_SCOUT_THREAD_ID" "🧠 <b>ניתוח</b>"$'\n'"• לא הושלם ניתוח עמוק של אף סרטון הפעם"$'\n'"• התוכן נכתב לפי הפרופיל והסגנון של Ivy"
          fi

      - name: Scout — push the best fresh inspiration to Telegram
        if: inputs.inspiration_url == '' && inputs.resume_run_id == ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          source "$GITHUB_WORKSPACE/scripts/tg.sh"
          RUN_ID="${{ steps.run.outputs.run_id }}"
          python -m content_scout.picks --run-id "$RUN_ID" --top 8 --out picks.json
          NEW=$(node "$GITHUB_WORKSPACE/scripts/inspiration.mjs" new-picks --file picks.json --max 3)
          COUNT=$(jq 'length' <<< "$NEW")
          [ "$COUNT" -eq 0 ] && { echo "no new inspiration to push"; exit 0; }
          tg_send "$TELEGRAM_SCOUT_THREAD_ID" "💡 <b>Scout — $COUNT השראות חדשות</b>"$'\n'"בחרתי פוסטים שהצליחו הרבה מעל הרגיל של היוצר שלהם. לחץ על מה שמדבר אליך:"
          for i in $(seq 0 $((COUNT - 1))); do
            P=$(jq -c ".[$i]" <<< "$NEW")
            ID=$(jq -r '.id' <<< "$P"); URL=$(jq -r '.url' <<< "$P"); THUMB=$(jq -r '.thumb // empty' <<< "$P")
            HTML="<b>$(esc "$(jq -r '.title' <<< "$P")")</b> — @$(esc "$(jq -r '.author' <<< "$P")") · פי $(jq -r '.score' <<< "$P") מהרגיל"
            while IFS= read -r b; do [ -n "$b" ] && HTML="$HTML"$'\n'"• $(esc "$b")"; done < <(jq -r '.bullets[]?' <<< "$P")
            HTML="$HTML"$'\n'"<a href=\"$(esc "$URL")\">לפוסט המקורי</a>"
            KB=$(jq -nc --arg g "insp:go:$ID" --arg k "insp:skip:$ID" '{inline_keyboard:[[{text:"🎨 תעשה כזה", callback_data:$g},{text:"⏭ דלג", callback_data:$k}]]}')
            if [ -n "$THUMB" ] && [ -f "$THUMB" ]; then
              node "$GITHUB_WORKSPACE/scripts/telegram-send.mjs" --chat "$TELEGRAM_IVY_CHAT_ID" --thread "$TELEGRAM_SCOUT_THREAD_ID" \
                --media "$(jq -nc --arg p "$THUMB" --arg h "$HTML" '[{type:"photo", path:$p, captionHtml:$h}]')" --keyboard "$KB" \
                || tg_send "$TELEGRAM_SCOUT_THREAD_ID" "$HTML" "$KB"
            else
              tg_send "$TELEGRAM_SCOUT_THREAD_ID" "$HTML" "$KB"
            fi
          done

      - name: Plan — turn findings into this run's day(s) of Ivy content
        if: inputs.inspiration_url == '' && inputs.resume_run_id == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IN_NUM_DAYS: ${{ inputs.num_days }}
          IN_KIND: ${{ inputs.inspiration_kind }}
        run: |
          NUM_DAYS="${IN_NUM_DAYS:-1}"
          python -m content_scout.cli plan \
            --run-id "${{ steps.run.outputs.run_id }}" \
            --persona-dir "../../docs/personas/Ivy Vale" \
            --num-days "$NUM_DAYS" \
            --kind "${IN_KIND:-carousel}"
          echo "--- content_plan.json ---"
          cat "data/runs/${{ steps.run.outputs.run_id }}/content_plan.json"

      - name: Notify Telegram — Generator's plan
        if: inputs.analyze_only != true && inputs.resume_run_id == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCE: ${{ steps.mode.outputs.produce }}
        run: |
          source "$GITHUB_WORKSPACE/scripts/tg.sh"
          PLAN_FILE="data/runs/${{ steps.run.outputs.run_id }}/content_plan.json"
          COUNT=$(jq '.days | length' "$PLAN_FILE")
          DIGEST=$(python -m content_scout.cli digest-he --kind plan --file "$PLAN_FILE")
          TEXT="✍️ $(digest_html "$DIGEST" "מה יצרתי")"
          DETAILS=""
          for i in $(seq 0 $((COUNT - 1))); do
            CAPTION=$(esc "$(jq -r ".days[$i].caption" "$PLAN_FILE")")
            TEXT="$TEXT"$'\n'"💬 יום $((i + 1)) — כיתוב: \"$CAPTION\""
            DETAILS="$DETAILS"$'\n'"<b>יום $((i + 1))</b>"
            DETAILS="$DETAILS"$'\n'"תמונת פיד/פריים ראשון: $(esc "$(jq -r ".days[$i].generation_prompt" "$PLAN_FILE" | cut -c1-700)")"
            NS=$(jq -r ".days[$i].carousel_prompts | length // 0" "$PLAN_FILE"); [ "$NS" -gt 1 ] && DETAILS="$DETAILS"$'\n'"קרוסלה — $NS תמונות"
            SP=$(jq -r ".days[$i].story_prompt // empty" "$PLAN_FILE"); [ -n "$SP" ] && DETAILS="$DETAILS"$'\n'"סטורי: $(esc "$(cut -c1-500 <<< "$SP")")"
            ST=$(jq -r ".days[$i].story_text // empty" "$PLAN_FILE"); [ -n "$ST" ] && DETAILS="$DETAILS"$'\n'"טקסט סטורי: $(esc "$ST")"
            TTC=$(jq -r ".days[$i].tiktok_caption // empty" "$PLAN_FILE"); [ -n "$TTC" ] && DETAILS="$DETAILS"$'\n'"כיתוב טיקטוק: $(esc "$(cut -c1-900 <<< "$TTC")")"
            VP=$(jq -r ".days[$i].video_prompt // empty" "$PLAN_FILE"); [ -n "$VP" ] && DETAILS="$DETAILS"$'\n'"פרומפט וידאו: $(esc "$(cut -c1-1200 <<< "$VP")")"
          done
          TEXT="$TEXT"$'\n\n'"<blockquote expandable>🔧 פרומפטים וטקסטים (אנגלית)$DETAILS</blockquote>"
          if [ "$PRODUCE" = "true" ]; then
            tg_send "$TELEGRAM_GENERATOR_THREAD_ID" "$TEXT"
          else
            # PLAN APPROVAL: save the plan, show it with an estimated cost, and STOP — nothing is generated (no credits)
            # until the owner taps start (which re-runs this workflow with resume_run_id).
            RUN_ID="${{ steps.run.outputs.run_id }}"
            node "$GITHUB_WORKSPACE/scripts/content-item.mjs" plan --run-id "$RUN_ID" --run-dir "data/runs/$RUN_ID"
            COST=0
            for i in $(seq 0 $((COUNT - 1))); do
              VD=$(jq -r ".days[$i].video_duration_s // empty" "$PLAN_FILE")
              NS=$(jq -r ".days[$i].carousel_prompts | length // 0" "$PLAN_FILE")
              if [ -n "$VD" ]; then COST=$((COST + VD + 4)); elif [ "$NS" -gt 1 ]; then COST=$((COST + NS * 2 + 2 + 2)); else COST=$((COST + 4 + 2)); fi
            done
            TEXT="$TEXT"$'\n\n'"• 💳 עלות משוערת: כ-$COST קרדיטים"$'\n'"• 🛑 עדיין לא נוצר כלום — לא הוצאתי קרדיטים"$'\n\n'"👇 להתחיל בייצור?"
            KB=$(jq -nc --arg g "plan:go:$RUN_ID" --arg e "plan:edit:$RUN_ID" --arg n "plan:no:$RUN_ID" '{inline_keyboard:[[{text:"✅ התחל ייצור", callback_data:$g}],[{text:"✏️ שנה תוכנית", callback_data:$e},{text:"🗑 בטל", callback_data:$n}]]}')
            tg_send "$TELEGRAM_GENERATOR_THREAD_ID" "$TEXT" "$KB"
          fi

      - name: Generate each day's image/video and queue Buffer drafts
        if: steps.mode.outputs.produce == 'true'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          RUN_DIR="data/runs/${{ steps.run.outputs.run_id }}"
          PLAN_FILE="$RUN_DIR/content_plan.json"
          COUNT=$(jq '.days | length' "$PLAN_FILE")
          echo "Generating $COUNT day(s) of content..."
          echo '[]' > "$RUN_DIR/media.json"

          # Credits guard: report the balance in the Dispatch message and stop before spending the last ones.
          CREDITS=$(higgsfield account status 2>/dev/null | grep -oE '[0-9]+(\.[0-9]+)? credits' | grep -oE '^[0-9.]+' || true)
          echo "${CREDITS:-?}" > "$RUN_DIR/credits.txt"
          if [ -n "$CREDITS" ] && awk "BEGIN{exit !($CREDITS < 12)}"; then
            source "$GITHUB_WORKSPACE/scripts/tg.sh"
            tg_send "$TELEGRAM_GENERATOR_THREAD_ID" "⚠️ <b>נגמרים הקרדיטים</b>"$'\n'"• נשארו $CREDITS קרדיטים בלבד — עצרתי כדי לא לייצר חצי תוכן"$'\n'"• הם מתאפסים ב-13 לחודש"
            exit 1
          fi

          # Higgsfield answers a transient 5xx now and then (a 503 killed a whole run on 2026-10-03):
          # retry those up to 3 times; any other error fails immediately. Prints only the result URL.
          hf_gen() {
            local n=0 out
            until out=$(higgsfield generate create "$@" 2>&1); do
              n=$((n + 1))
              if [ "$n" -ge 3 ] || ! grep -q "HTTP 5" <<< "$out"; then echo "$out" >&2; return 1; fi
              echo "higgsfield 5xx, retrying ($n/3)..." >&2; sleep 20
            done
            tail -n 1 <<< "$out"
          }

          # gen_image <prompt> <aspect>: one reference-locked nano_banana_pro image, checked against Ivy's reference
          # (same person, no text, plausible anatomy, within platform limits) and regenerated ONCE if it fails.
          gen_image() {
            local prompt="$1" aspect="$2" attempt=1 url review
            while true; do
              url=$(hf_gen nano_banana_pro --prompt "$prompt" "${REF_FLAGS[@]}" --aspect_ratio "$aspect" --resolution 2k --wait --wait-timeout 5m)
              if curl -sSfL -o "$RUN_DIR/qa.png" "$url"; then
                review=$(python -m content_scout.image_review --image "$RUN_DIR/qa.png" --reference "${REFS[0]}" 2>/dev/null || echo '{"ok":true}')
                echo "image QA (attempt $attempt): $review" >&2
                if [ "$(jq -r '.ok' <<< "$review")" != "true" ] && [ "$attempt" -lt 2 ]; then attempt=$((attempt + 1)); continue; fi
              fi
              echo "$url"; return 0
            done
          }


          # Posting cadence (spec §12): Slot A (feed + candid story) = next AU morning /
          # US evening window; Slot B (reminder story, the day after Slot A) = US morning
          # peak window. These are stored on the row as OUR intended send time only — the
          # draft stays a plain Buffer draft until approved via Telegram (see the Dispatcher
          # confirmation step below and api/telegram/webhook.js's approve_ivy: handler).
          NOW_EPOCH=$(date -u +%s)
          TODAY_SLOT_A_EPOCH=$(date -u -d "$(date -u +%F) 21:00" +%s)
          if [ "$NOW_EPOCH" -lt "$TODAY_SLOT_A_EPOCH" ]; then
            BASE_SLOT_A_DATE=$(date -u +%F)
          else
            BASE_SLOT_A_DATE=$(date -u -d "+1 day" +%F)
          fi

          for i in $(seq 0 $((COUNT - 1))); do
            SLOT_A_DATE=$(date -u -d "$BASE_SLOT_A_DATE +$i day" +%F)
            SLOT_B_DATE=$(date -u -d "$SLOT_A_DATE +1 day" +%F)
            SLOT_A="${SLOT_A_DATE}T21:00:00+00:00"
            SLOT_B="${SLOT_B_DATE}T11:00:00+00:00"
            PROMPT=$(jq -r ".days[$i].generation_prompt" "$PLAN_FILE")
            CAPTION=$(jq -r ".days[$i].caption" "$PLAN_FILE")
            HASHTAGS=$(jq -r '.days['"$i"'].hashtags | map("#" + .) | join(" ")' "$PLAN_FILE")
            FULL_CAPTION="$CAPTION"$'\n\n'"$HASHTAGS"
            # TikTok gets its own long, natural caption with many hashtags (owner's standing direction);
            # fall back to the Instagram text if a plan has none.
            TT_CAPTION=$(jq -r ".days[$i].tiktok_caption // empty" "$PLAN_FILE")
            TT_TAGS=$(jq -r '.days['"$i"'].tiktok_hashtags // [] | map("#" + .) | join(" ")' "$PLAN_FILE")
            if [ -n "$TT_CAPTION" ]; then TT_TEXT="$TT_CAPTION"$'\n\n'"$TT_TAGS"; else TT_TEXT="$FULL_CAPTION"; fi
            STORY_PROMPT=$(jq -r ".days[$i].story_prompt // empty" "$PLAN_FILE")
            STORY_TEXT=$(jq -r ".days[$i].story_text // empty" "$PLAN_FILE")
            POST_REMINDER_TEXT=$(jq -r ".days[$i].post_reminder_text // empty" "$PLAN_FILE")
            STORY_AUDIO_MOOD=$(jq -r ".days[$i].story_audio_mood // empty" "$PLAN_FILE")
            REMINDER_AUDIO_MOOD=$(jq -r ".days[$i].reminder_audio_mood // empty" "$PLAN_FILE")
            VIDEO_PROMPT=$(jq -r ".days[$i].video_prompt // empty" "$PLAN_FILE")
            VIDEO_DUR=$(jq -r ".days[$i].video_duration_s // 12" "$PLAN_FILE")
            RUN_ID="${{ steps.run.outputs.run_id }}"
            DISPATCH_LOG="$RUN_DIR/dispatch_log.txt"

            echo "--- Day $i ---"
            # nano_banana_pro with multiple angle references (up to 14 allowed; using the
            # same 3-image set already proven for Ivy's character sheet) — confirmed exact
            # params via `higgsfield model get nano_banana_pro` before writing this, not
            # guessed: resolution is 1k|2k|4k (not "quality"), aspect_ratio supports 4:5.
            REF_FLAGS=()
            IFS=',' read -ra REFS <<< "$IVY_REFERENCES"
            for ref in "${REFS[@]}"; do
              REF_FLAGS+=(--image-references "$ref")
            done

            if [ -n "$VIDEO_PROMPT" ]; then
              # VIDEO DAY (spec §2/§9.2): Stage A = 9:16 anchor still, Stage B = Seedance 2.0 Mini
              # image-to-video with the anchor as @image_1 and the character sheet as @image_2.
              # Every clip goes through a vision QA pass (same outfit/place, no burned-in text,
              # modest, face visible) and is regenerated once if it fails — see video_review.py.
              WARDROBE=$(jq -r ".days[$i].wardrobe // empty" "$PLAN_FILE")
              ATTEMPT=1; QA_ISSUES=""
              while true; do
                ANCHOR_URL=$(hf_gen nano_banana_pro \
                  --prompt "$PROMPT" "${REF_FLAGS[@]}" \
                  --aspect_ratio 9:16 --resolution 2k \
                  --wait --wait-timeout 5m)
                echo "Day $i anchor image (attempt $ATTEMPT): $ANCHOR_URL"
                curl -sSfL -o "$RUN_DIR/anchor.png" "$ANCHOR_URL"
                VIDEO_URL=$(hf_gen seedance_2_0_mini \
                  --prompt "$VIDEO_PROMPT" \
                  --image-references "$RUN_DIR/anchor.png" \
                  --image-references "../../docs/personas/Ivy Vale/production/character-sheet.jpg" \
                  --aspect_ratio 9:16 --duration "$VIDEO_DUR" --resolution 720p --generate_audio=true \
                  --wait --wait-timeout 20m)
                echo "Day $i video (attempt $ATTEMPT): $VIDEO_URL"
                curl -sSfL -o "$RUN_DIR/video.mp4" "$VIDEO_URL"
                REVIEW=$(python -m content_scout.cli review-video --video "$RUN_DIR/video.mp4" --wardrobe "$WARDROBE")
                echo "QA verdict: $REVIEW"
                if [ "$(jq -r '.ok' <<< "$REVIEW")" = "true" ]; then QA_ISSUES=""; break; fi
                QA_ISSUES=$(jq -r '.issues_he | join("; ")' <<< "$REVIEW")
                if [ "$ATTEMPT" -ge 2 ]; then echo "QA still failing after $ATTEMPT attempts — continuing with a warning"; break; fi
                ATTEMPT=$((ATTEMPT + 1)); echo "QA failed ($QA_ISSUES) — regenerating"
              done

              node "$GITHUB_WORKSPACE/scripts/telegram-send.mjs" --chat "$TELEGRAM_IVY_CHAT_ID" --thread "$TELEGRAM_GENERATOR_THREAD_ID" \
                --media "$(jq -nc --arg a "$ANCHOR_URL" --arg v "$VIDEO_URL" --arg n "יום $((i + 1))" \
                  '[{type:"photo", url:$a, caption:($n + " — הפריים הראשון")}, {type:"video", url:$v, caption:($n + " — הסרטון")}]')" \
                || echo "warning: could not send the video to Telegram"

              pushd ../dispatch > /dev/null
              node create-draft.mjs --channel "$BUFFER_CHANNEL_INSTAGRAM" --video "$VIDEO_URL" --text "$FULL_CAPTION" --platform instagram --post-type reel --influencer ivy-vale --run-id "$RUN_ID" --scheduled-for "$SLOT_A" 2>&1 | tee -a "../content-scout/$DISPATCH_LOG"
              node create-draft.mjs --channel "$BUFFER_CHANNEL_TIKTOK" --video "$VIDEO_URL" --text "$TT_TEXT" --platform tiktok --influencer ivy-vale --run-id "$RUN_ID" --scheduled-for "$SLOT_A" 2>&1 | tee -a "../content-scout/$DISPATCH_LOG"
              popd > /dev/null

              jq --arg v "$VIDEO_URL" --arg a "$ANCHOR_URL" --arg sa "$SLOT_A" --arg c "$CAPTION" --arg q "$QA_ISSUES" \
                '. + [{kind:"video", video:$v, image:$a, slot_a:$sa, caption:$c, qa_issues:$q}]' "$RUN_DIR/media.json" > "$RUN_DIR/media.tmp" && mv "$RUN_DIR/media.tmp" "$RUN_DIR/media.json"
              continue
            fi

            NSLIDES=$(jq -r ".days[$i].carousel_prompts | length // 0" "$PLAN_FILE")
            SLIDE_URLS=()
            if [ "$NSLIDES" -gt 1 ]; then
              # CAROUSEL DAY: one 4:5 image per slide, same refs, same day/outfit/location.
              for s in $(seq 0 $((NSLIDES - 1))); do
                SLIDE_PROMPT=$(jq -r ".days[$i].carousel_prompts[$s]" "$PLAN_FILE")
                U=$(gen_image "$SLIDE_PROMPT" 4:5)
                echo "Day $i slide $((s + 1)): $U"
                SLIDE_URLS+=("$U")
              done
              IMAGE_URL="${SLIDE_URLS[0]}"
            else
              IMAGE_URL=$(gen_image "$PROMPT" 4:5)
              echo "Day $i image: $IMAGE_URL"
            fi

            # Second image: a dedicated 9:16 Story shot — a different candid moment from the
            # feed image, not a crop of it (see persona_content.py's story_prompt guidance).
            STORY_IMAGE_URL=""
            if [ -n "$STORY_PROMPT" ]; then
              STORY_IMAGE_URL=$(gen_image "$STORY_PROMPT" 9:16)
              echo "Day $i story image: $STORY_IMAGE_URL"
            fi

            # Show the owner the actual pictures that will go out (Generator topic).
            if [ "$NSLIDES" -gt 1 ]; then
              SLIDES_JSON=$(printf '%s\n' "${SLIDE_URLS[@]}" | jq -R . | jq -sc 'to_entries | map({type:"photo", url:.value, caption:("שקופית " + ((.key + 1) | tostring))})')
              MEDIA_JSON=$(jq -c --arg s "$STORY_IMAGE_URL" --arg n "יום $((i + 1))" '. + (if $s != "" then [{type:"photo", url:$s, caption:($n + " — תמונת סטורי קנדיד")}] else [] end)' <<< "$SLIDES_JSON")
            else
              MEDIA_JSON=$(jq -nc --arg f "$IMAGE_URL" --arg s "$STORY_IMAGE_URL" --arg n "יום $((i + 1))" \
                '[{type:"photo", url:$f, caption:($n + " — תמונת פיד (אינסטגרם + טיקטוק)")}] + (if $s != "" then [{type:"photo", url:$s, caption:($n + " — תמונת סטורי קנדיד")}] else [] end)')
            fi
            node "$GITHUB_WORKSPACE/scripts/telegram-send.mjs" --chat "$TELEGRAM_IVY_CHAT_ID" --thread "$TELEGRAM_GENERATOR_THREAD_ID" \
              --media "$MEDIA_JSON" || echo "warning: could not send the images to Telegram"

            # TikTok rejects the feed image as-is: it's 1856x2304 (4:5, 2k) =
            # 4,276,224px, over TikTok's 2,073,600px cap (confirmed live via a
            # Buffer "Invalid post" error — every TikTok draft was silently
            # failing to ever get created). Route it through api/img-proxy's
            # fit=tiktok resize instead of generating a second Higgsfield
            # image, so the TikTok draft gets the same shot, downscaled to fit.
            ENC_IMAGE_URL=$(printf '%s' "$IMAGE_URL" | jq -sRr @uri)
            TIKTOK_IMAGE_URL="https://ai-influencer-lovat.vercel.app/api/img-proxy?fit=tiktok&url=${ENC_IMAGE_URL}"

            pushd ../dispatch > /dev/null
            if [ "$NSLIDES" -gt 1 ]; then
              IG_IMAGES=$(IFS=,; echo "${SLIDE_URLS[*]}")
              TT_IMAGES=""
              for u in "${SLIDE_URLS[@]}"; do
                TT_IMAGES="${TT_IMAGES:+$TT_IMAGES,}https://ai-influencer-lovat.vercel.app/api/img-proxy?fit=tiktok&url=$(printf '%s' "$u" | jq -sRr @uri)"
              done
              node create-draft.mjs --channel "$BUFFER_CHANNEL_INSTAGRAM" --images "$IG_IMAGES" --text "$FULL_CAPTION" --platform instagram --influencer ivy-vale --run-id "$RUN_ID" --scheduled-for "$SLOT_A" 2>&1 | tee -a "../content-scout/$DISPATCH_LOG"
              node create-draft.mjs --channel "$BUFFER_CHANNEL_TIKTOK" --images "$TT_IMAGES" --text "$TT_TEXT" --platform tiktok --influencer ivy-vale --run-id "$RUN_ID" --scheduled-for "$SLOT_A" 2>&1 | tee -a "../content-scout/$DISPATCH_LOG"
            else
              node create-draft.mjs --channel "$BUFFER_CHANNEL_INSTAGRAM" --image "$IMAGE_URL" --text "$FULL_CAPTION" --platform instagram --influencer ivy-vale --run-id "$RUN_ID" --scheduled-for "$SLOT_A" 2>&1 | tee -a "../content-scout/$DISPATCH_LOG"
              node create-draft.mjs --channel "$BUFFER_CHANNEL_TIKTOK" --image "$TIKTOK_IMAGE_URL" --text "$TT_TEXT" --platform tiktok --influencer ivy-vale --run-id "$RUN_ID" --scheduled-for "$SLOT_A" 2>&1 | tee -a "../content-scout/$DISPATCH_LOG"
            fi
            # Two Instagram Stories/day: (1) a genuinely new candid Story moment, (2) a quick
            # "go see my new post" nudge reusing the feed image — see persona_content.py's
            # STORIES_GUIDANCE for why the second one is a same-image nudge rather than a true
            # native post-share sticker (that mechanic isn't exposed by the API Buffer uses).
            # Both Stories get real Instagram trending audio attached automatically (matched
            # to audio_mood via Buffer's searchInstagramAudio, falling back to trending) — see
            # create-draft.mjs's pickInstagramAudio. Not possible for TikTok (§11 in the spec).
            if [ -n "$STORY_IMAGE_URL" ] && [ -n "$STORY_TEXT" ]; then
              node create-draft.mjs --channel "$BUFFER_CHANNEL_INSTAGRAM" --image "$STORY_IMAGE_URL" --text "$STORY_TEXT" --platform instagram --influencer ivy-vale --post-type story --audio-mood "$STORY_AUDIO_MOOD" --run-id "$RUN_ID" --scheduled-for "$SLOT_A" 2>&1 | tee -a "../content-scout/$DISPATCH_LOG"
            fi
            if [ -n "$POST_REMINDER_TEXT" ]; then
              node create-draft.mjs --channel "$BUFFER_CHANNEL_INSTAGRAM" --image "$IMAGE_URL" --text "$POST_REMINDER_TEXT" --platform instagram --influencer ivy-vale --post-type story --audio-mood "$REMINDER_AUDIO_MOOD" --run-id "$RUN_ID" --scheduled-for "$SLOT_B" 2>&1 | tee -a "../content-scout/$DISPATCH_LOG"
            fi
            popd > /dev/null

            if [ "$NSLIDES" -gt 1 ]; then
              SLIDES_ARR=$(printf '%s\n' "${SLIDE_URLS[@]}" | jq -R . | jq -sc .)
              jq --argjson im "$SLIDES_ARR" --arg sa "$SLOT_A" --arg sb "$SLOT_B" --arg c "$CAPTION" \
                '. + [{kind:"carousel", images:$im, image:$im[0], slot_a:$sa, slot_b:$sb, caption:$c}]' "$RUN_DIR/media.json" > "$RUN_DIR/media.tmp" && mv "$RUN_DIR/media.tmp" "$RUN_DIR/media.json"
            else
              jq --arg f "$IMAGE_URL" --arg sa "$SLOT_A" --arg sb "$SLOT_B" --arg c "$CAPTION" \
                '. + [{kind:"image", image:$f, slot_a:$sa, slot_b:$sb, caption:$c}]' "$RUN_DIR/media.json" > "$RUN_DIR/media.tmp" && mv "$RUN_DIR/media.tmp" "$RUN_DIR/media.json"
            fi
          done

      - name: Record the content item (shared record every agent reads)
        if: always() && steps.run.outputs.run_id != '' && steps.mode.outputs.produce == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node "$GITHUB_WORKSPACE/scripts/content-item.mjs" upsert --run-id "${{ steps.run.outputs.run_id }}" --run-dir "data/runs/${{ steps.run.outputs.run_id }}"

      - name: Notify Telegram — Dispatcher confirmation
        if: always() && steps.run.outputs.run_id != '' && steps.mode.outputs.produce == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          source "$GITHUB_WORKSPACE/scripts/tg.sh"
          RUN_ID="${{ steps.run.outputs.run_id }}"
          RUN_DIR="data/runs/$RUN_ID"
          LOG_FILE="$RUN_DIR/dispatch_log.txt"
          if [ -f "$LOG_FILE" ]; then
            CREATED=$(grep -c "Draft created" "$LOG_FILE" || true)
            ERRORS=$(grep -c "Buffer error\|Warning:" "$LOG_FILE" || true)
          else
            CREATED=0
            ERRORS="?"
          fi
          MEDIA_COUNT=$(jq 'length' "$RUN_DIR/media.json" 2>/dev/null || echo 0)
          KIND=$(jq -r '.[0].kind // "image"' "$RUN_DIR/media.json" 2>/dev/null || echo image)
          if [ "$KIND" = "video" ]; then
            WHAT="ריל באינסטגרם + סרטון בטיקטוק"
          elif [ "$KIND" = "carousel" ]; then
            WHAT="קרוסלה ($(jq -r '.[0].images | length' "$RUN_DIR/media.json") תמונות) + 2 סטוריז באינסטגרם, ופוסט תמונות בטיקטוק"
          else
            WHAT="פוסט פיד + 2 סטוריז באינסטגרם, ופוסט תמונה בטיקטוק"
          fi
          HTML="📮 <b>Dispatcher — מוכן לאישור</b>"$'\n'"• נוצרו $CREATED טיוטות ב-Buffer: $WHAT"
          if [ "$MEDIA_COUNT" -ge 1 ]; then
            SA=$(jq -r '.[0].slot_a' "$RUN_DIR/media.json")
            HTML="$HTML"$'\n'"• 🕘 מועד מתוכנן: $(he_slot "$SA")"
            if [ "$KIND" != "video" ]; then
              SB=$(jq -r '.[0].slot_b' "$RUN_DIR/media.json")
              HTML="$HTML"$'\n'"• סטורי תזכורת: $(he_slot "$SB")"
            fi
          fi
          if [ "$KIND" = "video" ]; then
            QA=$(jq -r '.[0].qa_issues // ""' "$RUN_DIR/media.json")
            if [ -n "$QA" ]; then HTML="$HTML"$'\n'"• ⚠️ בדיקת איכות: $(esc "$QA") — כדאי לבקש גרסה חדשה"; else HTML="$HTML"$'\n'"• ✅ בדיקת איכות אוטומטית עברה"; fi
          fi
          [ "$ERRORS" != "0" ] && HTML="$HTML"$'\n'"• ⚠️ $ERRORS אזהרות/שגיאות — כדאי לבדוק את הלוג"
          CR=$(cat "$RUN_DIR/credits.txt" 2>/dev/null || echo "?")
          if [ "$CR" != "?" ]; then
            DAYS_LEFT=$(( ($(date -u -d "$(date -u +%Y-%m)-13" +%s) - $(date -u +%s)) / 86400 ))
            [ "$DAYS_LEFT" -lt 0 ] && DAYS_LEFT=$(( ($(date -u -d "$(date -u -d 'next month' +%Y-%m)-13" +%s) - $(date -u +%s)) / 86400 ))
            HTML="$HTML"$'\n'"• 💳 יתרת קרדיטים: $CR (מתאפסים ב-13 לחודש, בעוד $DAYS_LEFT ימים)"
          fi
          HTML="$HTML"$'\n\n'"👇 תור = תזכורת 15 דקות לפני ואתה לוחץ. אוטומטי = יעלה בלי לחיצה (תקבל עדכון עם אפשרות לבטל). ✏️ לשינוי, 🗑 למחיקה."
          KEYBOARD=$(jq -nc --arg a "approve_ivy:$RUN_ID" --arg b "approve_auto:$RUN_ID" --arg r "rev:$RUN_ID" --arg x "del:$RUN_ID" '{inline_keyboard:[[{text:"✅ אשר לתור (תזכורת לפני)", callback_data:$a}],[{text:"🌙 אשר ופרסם אוטומטית", callback_data:$b}],[{text:"✏️ שינוי", callback_data:$r},{text:"🗑 מחק", callback_data:$x}]]}')

          SENT=false
          if [ "$MEDIA_COUNT" -eq 1 ] && [ "$KIND" = "carousel" ]; then
            # An album can't carry buttons: show the slides, then the approval message below it.
            node "$GITHUB_WORKSPACE/scripts/telegram-send.mjs" --chat "$TELEGRAM_IVY_CHAT_ID" --thread "$TELEGRAM_DISPATCH_THREAD_ID" \
              --media "$(jq -c '.[0].images | map({type:"photo", url:.})' "$RUN_DIR/media.json")" || echo "warning: could not send the carousel preview"
          elif [ "$MEDIA_COUNT" -eq 1 ]; then
            # One day: the picture/video itself carries the Approve button, so what you approve is what you see.
            if [ "$KIND" = "video" ]; then
              ITEM=$(jq -c '[{type:"video", url:.[0].video}]' "$RUN_DIR/media.json")
            else
              ITEM=$(jq -c '[{type:"photo", url:.[0].image}]' "$RUN_DIR/media.json")
            fi
            ITEM=$(jq -c --arg h "$HTML" '.[0].captionHtml = $h' <<< "$ITEM")
            node "$GITHUB_WORKSPACE/scripts/telegram-send.mjs" --chat "$TELEGRAM_IVY_CHAT_ID" --thread "$TELEGRAM_DISPATCH_THREAD_ID" \
              --media "$ITEM" --keyboard "$KEYBOARD" && SENT=true || echo "warning: media message failed, falling back to text"
          fi
          if [ "$SENT" != "true" ]; then
            tg_send "$TELEGRAM_DISPATCH_THREAD_ID" "$HTML" "$KEYBOARD"
          fi

      - name: Save refreshed Higgsfield login back to Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node "$GITHUB_WORKSPACE/scripts/higgsfield-creds.mjs" save || true

      - name: Notify Telegram — pipeline failed
        if: failure() && steps.inspire.outputs.user_error != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          source "$GITHUB_WORKSPACE/scripts/tg.sh"
          tg_send "$TELEGRAM_DISPATCH_THREAD_ID" "❌ <b>הריצה נכשלה</b>"$'\n'"• לא נוצר ולא תוזמן שום דבר"$'\n'"• <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">לוג הריצה</a>"
