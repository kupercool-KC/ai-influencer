name: Higgsfield generate

# Runs the official Higgsfield CLI in a durable, session-independent environment.
# Auth comes from HIGGSFIELD_CREDENTIALS_B64 (a repo secret: base64 of
# ~/.config/higgsfield/credentials.json from a machine where `higgsfield auth login`
# was already completed) — never from a browser OAuth flow, which Higgsfield's MCP
# endpoint rejects for third-party web apps ("Forbidden origin").
#
# Optionally writes the result straight into the app's Supabase `influencers` row
# when influencer_id + image_slot are given (requires the SUPABASE_URL and
# SUPABASE_SERVICE_ROLE_KEY repo secrets — same values already in Vercel).

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Higgsfield model id"
        default: gpt_image_2
        required: true
      prompt:
        description: "Generation prompt"
        required: true
      image_references:
        description: "Comma-separated repo-relative paths to reference images"
        required: false
        default: ""
      aspect_ratio:
        description: "Aspect ratio (e.g. 9:16, 16:9, 4:5, 2:3, 1:1)"
        default: "9:16"
        required: true
      quality:
        description: "low | medium | high"
        default: high
        required: true
      resolution:
        description: "1k | 2k | 4k"
        default: 2k
        required: true
      influencer_id:
        description: "If set, write the result URL into this influencer's Supabase row"
        required: false
        default: ""
      image_slot:
        description: "mainImage | characterSheetImage | closeUpImage1 | closeUpImage2"
        required: false
        default: ""

# Shared with ivy-daily-content.yml: two runs refreshing the same Higgsfield session at once
# would invalidate each other's rotating token.
concurrency:
  group: higgsfield-session
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      HIGGSFIELD_WORKSPACE_ID: "464e34d3-f7ad-4da0-a24a-c00a94910a9b"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Higgsfield CLI
        run: npm i -g @higgsfield/cli

      - name: Restore Higgsfield login from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HIGGSFIELD_CREDENTIALS_B64: ${{ secrets.HIGGSFIELD_CREDENTIALS_B64 }}
        run: |
          mkdir -p ~/.config/higgsfield
          # See scripts/higgsfield-creds.mjs: the session is stored in Supabase and rewritten
          # after each run because the refresh token rotates. B64 secret = first-run fallback.
          if ! node scripts/higgsfield-creds.mjs load; then
            echo "$HIGGSFIELD_CREDENTIALS_B64" | base64 -d > ~/.config/higgsfield/credentials.json
          fi
          chmod 600 ~/.config/higgsfield/credentials.json
          higgsfield workspace set "$HIGGSFIELD_WORKSPACE_ID"
          higgsfield account status
          node scripts/higgsfield-creds.mjs save

      - name: Generate
        id: gen
        env:
          # Untrusted workflow_dispatch inputs go through env vars, never
          # directly into the run: script — see buffer-dispatch.yml for why
          # (GitHub Actions script injection: ${{ inputs.* }} substitutes as
          # raw text before bash runs, so unescaped content can break out of
          # quotes and execute arbitrary commands with this job's secrets in
          # scope). $ENV_VAR expansion at shell runtime is safe regardless.
          IN_MODEL: ${{ inputs.model }}
          IN_PROMPT: ${{ inputs.prompt }}
          IN_IMAGE_REFERENCES: ${{ inputs.image_references }}
          IN_ASPECT_RATIO: ${{ inputs.aspect_ratio }}
          IN_QUALITY: ${{ inputs.quality }}
          IN_RESOLUTION: ${{ inputs.resolution }}
        run: |
          set -e
          FLAGS=()
          IFS=',' read -ra REFS <<< "$IN_IMAGE_REFERENCES"
          for ref in "${REFS[@]}"; do
            ref_trimmed=$(echo "$ref" | xargs)
            if [ -n "$ref_trimmed" ]; then
              FLAGS+=(--image-references "$ref_trimmed")
            fi
          done

          # nano_banana_pro (what Ivy's pictures use) has no --quality parameter: pass quality "none" to skip it.
          QUAL=()
          [ "$IN_QUALITY" != "none" ] && QUAL=(--quality "$IN_QUALITY")

          URL=$(higgsfield generate create "$IN_MODEL" \
            --prompt "$IN_PROMPT" \
            "${FLAGS[@]}" \
            --aspect_ratio "$IN_ASPECT_RATIO" \
            "${QUAL[@]}" \
            --resolution "$IN_RESOLUTION" \
            --wait --wait-timeout 5m)

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Generated: $URL"

      - name: Record in media_assets and update the influencer profile (optional)
        if: ${{ inputs.influencer_id != '' && inputs.image_slot != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # See the Generate step above for why untrusted inputs are passed
          # as env vars instead of interpolated into the script directly.
          IN_INFLUENCER_ID: ${{ inputs.influencer_id }}
          IN_IMAGE_SLOT: ${{ inputs.image_slot }}
          IN_MODEL: ${{ inputs.model }}
          IN_ASPECT_RATIO: ${{ inputs.aspect_ratio }}
          IN_PROMPT: ${{ inputs.prompt }}
          GEN_URL: ${{ steps.gen.outputs.url }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secrets not set — skipping DB write. Generated URL: $GEN_URL"
            exit 0
          fi

          # media_assets is the source of truth for history — mark any prior
          # asset in this slot as no longer current, then insert the new one.
          # influencer_id/slot go into the URL as PostgREST filters, so they're
          # URL-encoded via jq/curl --data-urlencode rather than interpolated
          # raw (avoids both shell and query-string injection).
          ENC_INFLUENCER_ID=$(jq -rn --arg v "$IN_INFLUENCER_ID" '$v|@uri')
          ENC_IMAGE_SLOT=$(jq -rn --arg v "$IN_IMAGE_SLOT" '$v|@uri')

          curl -s -X PATCH "$SUPABASE_URL/rest/v1/media_assets?influencer_id=eq.$ENC_INFLUENCER_ID&slot=eq.$ENC_IMAGE_SLOT&is_current=eq.true" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d '{"is_current": false}'

          curl -s -X POST "$SUPABASE_URL/rest/v1/media_assets" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "$(jq -n --arg iid "$IN_INFLUENCER_ID" --arg slot "$IN_IMAGE_SLOT" \
                  --arg url "$GEN_URL" --arg model "$IN_MODEL" \
                  --arg ar "$IN_ASPECT_RATIO" --arg prompt "$IN_PROMPT" \
                  '{influencer_id:$iid, slot:$slot, type:"image", url:$url, model:$model, aspect_ratio:$ar, prompt:$prompt, source:"cli", is_current:true, label:$slot}')"

          # Also keep the influencer's own profile row in sync, since the app
          # reads mainImage/characterSheetImage/etc directly off it.
          ROW=$(curl -s "$SUPABASE_URL/rest/v1/influencers?id=eq.$ENC_INFLUENCER_ID&select=*" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")

          echo "$ROW" | jq --arg slot "$IN_IMAGE_SLOT" --arg url "$GEN_URL" \
            '.[0] as $r | $r.data + {($slot): $url} | {id: $r.id, name: $r.name, gender: $r.gender, niche: $r.niche, data: .}' \
            > /tmp/payload.json

          curl -s -X PATCH "$SUPABASE_URL/rest/v1/influencers?id=eq.$ENC_INFLUENCER_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d @/tmp/payload.json

          echo "Wrote $IN_IMAGE_SLOT = $GEN_URL for influencer $IN_INFLUENCER_ID (media_assets + influencers)"

      - name: Send the picture to the Generator topic in Telegram
        if: steps.gen.outputs.url != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          URL: ${{ steps.gen.outputs.url }}
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1 || true
          node scripts/telegram-send.mjs --chat "-1004305763915" --thread "6" \
            --media "$(jq -nc --arg u "$URL" '[{type:"photo", url:$u, caption:"🎨 התמונה שביקשת"}]')"

      - name: Save refreshed Higgsfield login back to Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/higgsfield-creds.mjs save || true

      - name: Notify Telegram — generation failed
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_IVY_CHAT_ID: "-1004305763915"
          TELEGRAM_GENERATOR_THREAD_ID: "6"
        run: |
          source scripts/tg.sh
          source scripts/explain-failure.sh
          REASON=$(failure_reason_he | while IFS= read -r l; do echo "• $(esc "$l")"; done)
          tg_send "$TELEGRAM_GENERATOR_THREAD_ID" "❌ <b>היצירה נכשלה</b>"$'\n'"$REASON"$'\n'"• <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">לוג הריצה</a>"
