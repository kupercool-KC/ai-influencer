name: Update Control Board

# Runs on GitHub's own infrastructure, independent of anyone's computer being on — same
# pattern as the other scheduled/dispatched agents (content-scout, buffer-dispatch, etc).
#
# GitHub Actions cron has no "every N days" primitive and no timezone support (always UTC),
# so this fires nightly and the "every 2 days" cadence + Israel-night timing are handled
# below: a day-parity gate skips every other run, and 20:27 UTC lands at night either side of
# Israel's DST switch (23:27 Israel time in summer/IDT, 22:27 in winter/IST).
#
# Needs repo secret: ANTHROPIC_API_KEY (same value already used by the Telegram bot's Chat
# mode on Vercel — see api/telegram/webhook.js). Reuses TELEGRAM_BOT_TOKEN /
# TELEGRAM_OWNER_CHAT_ID (already configured for run-code.yml) to ping when it updates.
on:
  schedule:
    - cron: '27 20 * * *'
  workflow_dispatch: {} # manual "run now" button in the Actions tab, for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `git log <last-board-commit>..HEAD` works

      - name: Every-2-days gate
        id: gate
        run: |
          DAY_INDEX=$(( $(date -u +%s) / 86400 ))
          if [ $(( DAY_INDEX % 2 )) -ne 0 ]; then
            echo "Off-day — skipping this run to keep the ~2-day cadence."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20

      - name: Ask Claude to refresh the control board
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/update-control-board.mjs

      # main is a protected branch (PR + the lint-and-build check required) —
      # a direct `git push` here is rejected outright (GH006). This failed
      # silently-ish (a GitHub email each time, easy to miss) on every run
      # since the protection was added, so the board never actually updated.
      # Branch + PR + wait-for-check + merge keeps this fully unattended
      # while still going through the same gate every other change does.
      - name: Commit to a branch if changed
        if: steps.gate.outputs.run == 'true'
        id: commit
        run: |
          git config user.name "control-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/control-board.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH="auto/control-board-$(date -u +%Y%m%d%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "Auto-update Control Board"
            git push -u origin "$BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR, wait for checks, merge
        if: steps.gate.outputs.run == 'true' && steps.commit.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --head "${{ steps.commit.outputs.branch }}" --base main \
            --title "Auto-update Control Board" \
            --body "Automated — see .github/workflows/update-control-board.yml"
          PR_NUM=$(gh pr view "${{ steps.commit.outputs.branch }}" --json number -q .number)
          echo "num=$PR_NUM" >> "$GITHUB_OUTPUT"
          gh pr checks "$PR_NUM" --watch --fail-fast
          gh pr merge "$PR_NUM" --merge --delete-branch

      - name: Notify Telegram
        if: steps.gate.outputs.run == 'true' && steps.commit.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_OWNER_CHAT_ID}" \
            -d text="📋 Control Board auto-updated (PR #${{ steps.pr.outputs.num }}): https://kupercool-kc.github.io/ai-influencer/control-board.html"
